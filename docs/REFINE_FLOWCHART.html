:root { color-scheme:light; --ink:#172b3a; --dim:#4c6271; --accent:#126754; --line:#bdcbd1; --paper:#f3f6f6; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--paper); font: 15px/1.55 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
main { max-width:1260px; margin:auto; padding:38px 28px 72px; }

p { margin:7px 0; }
.eyebrow { color:var(--accent); font-size:13px; font-weight:750; }
header p { max-width:70ch; color:var(--dim); }

.legend { display:flex; flex-wrap:wrap; gap:14px; margin:12px 0 20px; color:var(--dim); font-size:13px; }
.legend span { display:flex; align-items:center; gap:6px; }
.key { display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid #788b96; background:white; }
.key.decision { border-color:#a0782b; background:#fff7df; }
.key.done { border-color:#448374; background:#e9f6f0; }
.panel { background:white; border:1px solid #cbd8dc; border-radius:12px; margin:0 0 22px; overflow:hidden; scroll-margin-top:8px; }
.panel header { padding:20px 24px 15px; border-bottom:1px solid #e3ebed; }
.chart { overflow-x:auto; background:#fbfdfd; }
svg { width:100%; min-width:860px; display:block; font-family:inherit; }
.edge { fill:none; stroke:#5e7783; stroke-width:1.65; }
.edge.loop { stroke:#526e7d; stroke-dasharray:6 4; }
.edge-label { font-size:11.8px; fill:#304d5e; paint-order:stroke; stroke:#fbfdfd; stroke-width:5px; stroke-linejoin:round; font-weight:650; }
.node { cursor:pointer; }
.node .box { fill:#fff; stroke:#8ea4ae; stroke-width:1.2; }
.node.decision .box { fill:#fff7df; stroke:#aa833d; }
.node.done .box { fill:#e9f6f0; stroke:#4b8877; }
.node .badge { fill:#284b60; }
.node.decision .badge { fill:#715111; }
.node.done .badge { fill:#126754; }
.node .code { fill:#fff; font-size:12px; font-weight:750; font-variant-numeric:tabular-nums; }
.node .label { fill:#142d40; font-size:15px; font-weight:730; }
.node .desc { fill:#425867; font-size:12.5px; }
.node:hover .box, .node:focus .box, .node:target .box, .node.selected .box { stroke:#094f9b; stroke-width:2.8; }
.node:focus { outline:none; }
details { margin:18px 24px; color:var(--dim); }
summary { cursor:pointer; }
dialog { border:1px solid var(--line); border-radius:12px; max-width:min(520px, calc(100% - 28px)); padding:22px; color:var(--ink); }
dialog::backdrop { background:#182b3b55; }
dialog h2 { font-size:20px; margin:0 0 12px; }
dialog p { margin:12px 0 15px; }
dialog a { display:block; width:fit-content; color:#0e5f64; overflow-wrap:anywhere; }
dialog .actions { display:flex; gap:9px; margin-top:18px; justify-content:flex-end; }
button { font:inherit; cursor:pointer; color:var(--ink); border:1px solid var(--line); background:white; border-radius:6px; padding:6px 11px; }
button[data-copy] { background:#126754; border-color:#126754; color:white; }
@media(max-width:650px) { main { padding:20px 12px 44px; } .panel header { padding:15px; } }
@media print { body, .chart { background:white; } main { padding:0; } nav, dialog { display:none!important; } .panel { break-before:page; margin:0; border:0; } .panel:first-of-type { break-before:auto; } svg { min-width:0; max-height:245mm; } .panel header { padding:5mm 0 2mm; } }

const svgNS = 'http://www.w3.org/2000/svg';
const width = 1000, nodeWidth = 301, nodeHeight = 78, rowGap = 107;
const kindNames = {p:'处理', q:'判断', d:'产物或流转'};
const xHalf = nodeWidth / 2;
const formatId = id => String(id).padStart(2, '0');
const info = document.querySelector('#detail');
const heading = document.querySelector('#detail-heading');
const details = document.querySelector('#detail-text');
const source = document.querySelector('#detail-source');
const copy = document.querySelector('[data-copy]');
const labels = new Map();
const context = document.createElement('canvas').getContext('2d');
context.font = '12.5px system-ui, PingFang SC, Microsoft YaHei, sans-serif';
let current = null;

function svgEl(name, attributes, value) {
  const el = document.createElementNS(svgNS, name);
  for (const [key, attr] of Object.entries(attributes)) el.setAttribute(key, attr);
  if (value) el.textContent = value;
  return el;
}

function splitLine(text) {
  const lines = [];
  let line = '';
  for (const char of text) {
    if (context.measureText(line + char).width > nodeWidth - 26 && line) {
      lines.push(line);
      line = '';
    }
    line += char;
  }
  if (line) lines.push(line);
  return lines;
}

function routeEdge(from, to, rail) {
  if (rail != null) {
    const direction = rail < from.x ? -1 : 1;
    const targetSide = rail < to.x ? -1 : 1;
    return [[from.x + direction*xHalf, from.y + nodeHeight/2],
            [rail, from.y + nodeHeight/2],
            [rail, to.y + nodeHeight/2],
            [to.x + targetSide*xHalf, to.y + nodeHeight/2]];
  }
  if (from.y === to.y) {
    const direction = Math.sign(to.x-from.x);
    const y = from.y + nodeHeight/2;
    return [[from.x + direction*xHalf,y],[to.x-direction*xHalf,y]];
  }
  if (from.x === to.x) {
    return [[from.x,from.y+nodeHeight],[to.x,to.y]];
  }
  const mid = (from.y + nodeHeight + to.y)/2;
  return [[from.x,from.y + nodeHeight],[from.x,mid],[to.x,mid],[to.x,to.y]];
}

function drawEdge(svg, positions, edge, marker) {
  const [start, end, label, rail, loop] = edge;
  const from = positions.get(start), to = positions.get(end);
  const coords = routeEdge(from, to, rail);
  const line = svgEl('polyline', {points:coords.map(pair => pair.join(',')).join(' '), class:loop?'edge loop':'edge',
                                  'marker-end':'url(#'+marker+')'});
  svg.append(line);
  if (!label) return;
  let at, align;
  if (rail != null) {
    const left = rail < width/2;
    at = [rail + (left ? 8 : -8), (from.y + to.y)/2 + nodeHeight/2];
    align = left ? 'start' : 'end';
  } else if (coords[0][0] === coords[coords.length-1][0]) {
    at = [from.x+8,(from.y+nodeHeight+to.y)/2+4];
    align = 'start';
  } else {
    const left = coords.length === 4 ? coords[1] : coords[0];
    const right = coords.length === 4 ? coords[2] : coords[1];
    at = [(left[0]+right[0])/2,left[1]-5];
    align = 'middle';
  }
  svg.append(svgEl('text',{x:at[0],y:at[1],class:'edge-label','text-anchor':align},label));
}

function drawNode(svg, item, pos) {
  const [id,,,kind,title,desc,ref,note] = item;
  const number = formatId(id);
  const node = svgEl('g',{class:'node '+(kind==='q'?'decision':kind==='d'?'done':'process'),id:'step-'+number,
    role:'button',tabindex:0,'aria-label':number+' '+kindNames[kind]+' '+title});
  const x = pos.x - xHalf, y = pos.y;
  node.append(svgEl('rect',{x,y,width:nodeWidth,height:nodeHeight,rx:10,class:'box'}));
  node.append(svgEl('rect',{x:x+12,y:y+12,width:33,height:22,rx:5,class:'badge'}));
  node.append(svgEl('text',{x:x+28.5,y:y+27.4,class:'code','text-anchor':'middle'},number));
  node.append(svgEl('text',{x:x+55,y:y+27,class:'label'},title));
  splitLine(desc).forEach((line,i) => node.append(svgEl('text',{x:x+12,y:y+51+i*16,class:'desc'},line)));
  node.append(svgEl('title',{},number+' '+title+' · '+desc));
  node.addEventListener('click', () => showStep(number));
  node.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showStep(number); }
  });
  labels.set(number,{node,title,desc,ref,note});
  svg.append(node);
}

function buildGroup(group) {
  const link = document.createElement('a');
  link.href = '#'+group.key;
  link.textContent = group.range+' '+group.name;
  document.querySelector('#contents').append(link);

  const section = document.createElement('section');
  section.className = 'panel';
  section.id = group.key;
  const head = document.createElement('header'), title = document.createElement('h2'), hint = document.createElement('p');
  title.textContent = group.range+' '+group.name;
  hint.textContent = group.note;
  head.append(title,hint);
  section.append(head);
  const chart = document.createElement('div');
  chart.className = 'chart';
  const height = Math.max(...group.nodes.map(item => item[2]))*rowGap+nodeHeight+32;
  const svg = svgEl('svg',{viewBox:'0 0 '+width+' '+height,width,height,role:'group','aria-label':group.name});
  const marker = 'arrow-'+group.key;
  const defs = svgEl('defs',{}), arrow = svgEl('marker',{id:marker,viewBox:'0 0 8 8',refX:7,refY:4,
    markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});
  arrow.append(svgEl('path',{d:'M0 0 L8 4 L0 8 Z',fill:'#5e7783'}));
  defs.append(arrow);
  svg.append(defs);
  const positions = new Map(group.nodes.map(([id,x,row]) => [id,{x,y:16+row*rowGap}]));
  for (const edge of group.edges) drawEdge(svg,positions,edge,marker);
  for (const item of group.nodes) drawNode(svg,item,positions.get(item[0]));
  chart.append(svg);
  section.append(chart);
  document.querySelector('#panels').append(section);
}

function showStep(number) {
  const item = labels.get(number);
  if (!item) return;
  if (current) labels.get(current).node.classList.remove('selected');
  current = number;
  item.node.classList.add('selected');
  heading.textContent = number+' '+item.title;
  details.textContent = item.note || item.desc;
  const [file,symbol] = item.ref.split('::');
  source.href = '../src/dex_frax/'+file;
  source.title = '在源码中查找 '+symbol;
  source.textContent = file+' · '+symbol;
  copy.textContent = '复制编号 '+number;
  info.showModal();
}

copy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(current);
    copy.textContent = '已复制 '+current;
  } catch {
    const field = document.createElement('textarea');
    field.value = current;
    info.append(field);
    field.select();
    if (document.execCommand('copy')) copy.textContent = '已复制 '+current;
    field.remove();
  }
});
for (const group of groups) buildGroup(group);
